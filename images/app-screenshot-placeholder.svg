  <rect x="20" y="400" width="260" height="80" rx="8" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="40" y="430" font-family="Poppins, sans-serif" font-size="16" fill="#333333">Vendors</text>
  <text x="40" y="455" font-family="Poppins, sans-serif" font-size="14" fill="#666666">8 vendors confirmed</text>
