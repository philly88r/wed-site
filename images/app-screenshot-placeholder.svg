  <circle cx="60" cy="565" r="20" fill="#F5F5F7"/>
  <text x="60" y="570" font-family="Poppins, sans-serif" font-size="20" fill="#054697" text-anchor="middle">🏠</text>
  
  <circle cx="150" cy="565" r="20" fill="#F5F5F7"/>
